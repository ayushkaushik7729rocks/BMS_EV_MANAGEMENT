<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d12"><meta name="description" content="EV Guardian AI battery monitoring dashboard">
  <title>EV Guardian AI · Battery monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">ϟ</div><div><b>EV GUARDIAN</b><span>INTELLIGENCE PLATFORM</span></div></div>
      <div class="workspace"><i class="workspace-dot"></i><div><small>ACTIVE WORKSPACE</small><strong>Lab prototype</strong></div><span>⌄</span></div>
      <div class="nav-caption">MONITORING</div>
      <nav class="nav-list">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">▦</span><span>Dashboard</span></button>
        <button class="nav-item" data-page="health"><span class="nav-icon">▣</span><span>Battery health</span></button>
        <button class="nav-item" data-page="thermal"><span class="nav-icon">♨</span><span>Thermal analysis</span></button>
        <button class="nav-item" data-page="alerts"><span class="nav-icon">♧</span><span>Alerts</span><em>2</em></button>
        <button class="nav-item" data-page="system"><span class="nav-icon">⌘</span><span>Device &amp; system</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="safety-card"><div class="safety-top">◇ <span>SAFETY STATUS</span></div><strong>Protection active</strong><small>All monitored values in range</small><div class="safety-line"><i></i></div></div>
        <button class="nav-item"><span class="nav-icon">⚙</span><span>Settings</span></button><button class="nav-item"><span class="nav-icon">?</span><span>Help &amp; documentation</span></button>
      </div>
      <div class="profile"><div class="avatar">AG</div><div><b>Alex Green</b><small>Project administrator</small></div><span class="profile-signal">◉</span></div>
    </aside>
    <main class="main-area"><header class="topbar"><div class="breadcrumb">Monitoring <span>/</span> <b id="crumb">Dashboard</b></div><div class="top-actions"><div class="live-pill"><i></i> Live telemetry</div><button class="icon-button" aria-label="Search">⌕</button><button class="icon-button" aria-label="Help">?</button><button class="top-notice" data-go="alerts" aria-label="View alerts">♧<i></i></button><div class="top-divider"></div><div class="top-date">MON, OCT 05<small id="clock">10:32:18 AM</small></div><span class="muted">⌄</span></div></header>
      <div class="main-scroll"><div class="page-content" id="page-content"></div></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
